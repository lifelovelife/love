<!DOCTYPE html>
<html lang="en" style="background: white;">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nicolle Bustos</title>
    <link rel="icon" type="image/png" href="FAVICON.png">
    
    <script src="https://www.youtube.com/iframe_api"></script>

    <style>
        * {
            -webkit-user-drag: none;
            -webkit-user-select: none;
            user-select: none;
        }

        .huella {
            position: absolute;
            width: 128px;
            height: 128px;
            background-image: url("HUELLAS.png");
            background-size: contain;
            background-position: center;
            background-repeat: no-repeat;
            pointer-events: none;
            animation: vanish .7s ease-out forwards;
            z-index: 99999;
        }

        @keyframes vanish {
            from {
                opacity: .3;
                transform: translate(-50%, -50%) scale(1);
            }
            to {
                opacity: 0;
                transform: translate(-50%, -50%) scale(0.5);
            }
        }
    </style>
</head>

<body style="background: #defe3fcc; height: 100vh; margin: 0; overflow: hidden; display: flex; justify-content: center; align-items: center;">
    <div class="cursor"></div>
    <img src="PRONTO.png" style="width: 100vw; height: 100vh; object-fit: fill;">
    <img src="DANCING_BANANA.gif" style="width: 240px; position: absolute; bottom: 18%;">
    <img src="ESPACIO.jpg" style="width: 100vw; height: 100vh; position: absolute; mix-blend-mode: color-dodge; pointer-events: none; z-index: 5;">

    <script>
        document.addEventListener('mousemove', (e) => {
            const contenedor = document.querySelector('.cursor');
            if (!contenedor) return;
            
            const punto = document.createElement('div');
            punto.classList.add('huella');
            punto.style.left = `${e.clientX}px`;
            punto.style.top = `${e.clientY}px`;

            contenedor.appendChild(punto);

            setTimeout(() => {
                punto.remove();
            }, 600);
        });
    </script>
</body>
</html>
