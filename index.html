<!DOCTYPE html>
<html lang="en" style="background: white;">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nicolle Bustos</title>
    <link rel="icon" type="image/png" href="FAVICON.png">
    
    <script src="https://www.youtube.com/iframe_api"></script>

    <style>
        * {
            -webkit-user-drag: none;
            -webkit-user-select: none;
            user-select: none;
        }

        img:not(.ayuda) {
            pointer-events: none;
        }

        .ayuda {
            transform: rotate(5deg);
            transition: .5s ease-out;
            border-radius: 50%;
            box-shadow: 1px 1px 5px 0px rgba(14, 33, 238, 0.8);
            -webkit-box-shadow: 1px 1px 5px 0px rgba(14, 33, 238, 0.8);
            -moz-box-shadow: 1px 1px 5px 0px rgba(14, 33, 238, 0.8);
        }

        .ayuda:hover {
            transform: rotate(240deg);
        }

        .huella {
            position: absolute;
            width: 120px;
            height: 120px;
            background-image: url("HUELLAS.png");
            background-size: contain;
            background-position: center;
            background-repeat: no-repeat;
            pointer-events: none;
            animation: vanish .7s ease-out forwards;
            z-index: 99999;
        }

        @keyframes vanish {
            from {
                opacity: .3;
                transform: translate(-50%, -50%) scale(1);
            }
            to {
                opacity: 0;
                transform: translate(-50%, -50%) scale(0.5);
            }
        }
    </style>
</head>

<body style="background: #defe3f98; height: 100vh; margin: 0; overflow: hidden; display: flex; justify-content: center; align-items: center;">
    <div class="cursor"></div>
    <img src="PRONTO.png" style="width: 100vw; height: 100vh; object-fit: fill;">
    <img src="DANCING_BANANA.gif" style="height: 160px; position: absolute; top: 0; left: 0;">
    <iframe width=100" height="100" scrolling="no" frameborder="no" allow="encrypted-media" src="https://w.soundcloud.com/player/?url=https%3A//api.soundcloud.com/tracks/soundcloud%253Atracks%253A2105546394&color=%23884dff&hide_related=true&show_comments=false&show_user=false&show_reposts=false&show_teaser=false" style="position: absolute; top: 160px; left: 32px;"></iframe>
    <img src="ESPACIO.jpg" style="width: 100vw; height: 100vh; position: absolute; mix-blend-mode: color-dodge; z-index: 5;">

    <a href="https://www.instagram.com/kafu1988canal/" target="_blank"><img class="ayuda" src="AYUDA.png" style="width: 140px; position: absolute; bottom: 4%; right: 3%; z-index: 6;"></a>

    <script>
        document.addEventListener('mousemove', (e) => {
            const contenedor = document.querySelector('.cursor');
            if (!contenedor) return;
            
            const punto = document.createElement('div');
            punto.classList.add('huella');
            punto.style.left = `${e.clientX}px`;
            punto.style.top = `${e.clientY}px`;

            contenedor.appendChild(punto);

            setTimeout(() => {
                punto.remove();
            }, 600);
        });
    </script>
</body>
</html>
