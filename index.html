<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="orquidea.png">
    <title>Nicolle Bustos</title>
    <link rel="stylesheet" href="estilo.css">
</head>

<body>
    <div class="cursor"></div>
    <div class="grid"></div>
    <section class="info">
        <div>
            <span>Nicolle Bustos</span>
            <a href="mailto:correodenicolle@gmail.com">correodenicolle@gmail.com</a>
        </div>
    </section>

    <script>
        const items = [
            { col: 6, row: 1 },
            { col: 7, row: 1 },
            { col: 8, row: 1 },
            { col: 9, row: 1 },
            { col: 10, row: 1 },
            { col: 13, row: 1 },
            { col: 14, row: 1 },
            { col: 15, row: 1 },
            { col: 16, row: 1 },
            { col: 17, row: 1 },

            { col: 5, row: 2 },
            { col: 11, row: 2 },
            { col: 12, row: 2 },
            { col: 18, row: 2 },

            { col: 4, row: 3 },
            { col: 7, row: 3 },
            { col: 8, row: 3 },
            { col: 9, row: 3 },
            { col: 14, row: 3 },
            { col: 15, row: 3 },
            { col: 16, row: 3 },
            { col: 19, row: 3 },

            { col: 4, row: 4 },
            { col: 6, row: 4 },
            { col: 10, row: 4 },
            { col: 13, row: 4 },
            { col: 17, row: 4 },
            { col: 19, row: 4 },

            { col: 3, row: 5 },
            { col: 6, row: 5 },
            { col: 11, row: 5 },
            { col: 12, row: 5 },
            { col: 17, row: 5 },
            { col: 20, row: 5 },

            { col: 3, row: 6 },
            { col: 5, row: 6 },
            { col: 18, row: 6 },
            { col: 20, row: 6 },

            { col: 3, row: 7 },
            { col: 5, row: 7 },
            { col: 18, row: 7 },
            { col: 20, row: 7 },

            {col: 3, row: 8},
            {col: 6, row: 8},
            {col: 17, row: 8},
            {col: 20, row: 8},

            {col: 4, row: 9},
            {col: 6, row: 9},
            {col: 17, row: 9},
            {col: 19, row: 9},
            
            {col: 4, row: 10},
            {col: 7, row: 10},
            {col: 16, row: 10},
            {col: 19, row: 10},

            {col: 5, row: 11},
            {col: 8, row: 11},
            {col: 15, row: 11},
            {col: 18, row: 11},

            {col: 6, row: 12},
            {col: 9, row: 12},
            {col: 14, row: 12},
            {col: 17, row: 12},

            {col: 7, row: 13},
            {col: 10, row: 13},
            {col: 13, row: 13},
            {col: 16, row: 13},

            {col: 8, row: 14},
            {col: 11, row: 14},
            {col: 12, row: 14},
            {col: 15, row: 14},

            {col: 9, row: 15},
            {col: 14, row: 15},

            {col: 10, row: 16},
            {col: 13, row: 16},

            {col: 11, row: 17},
            {col: 12, row: 17}
        ];

        const grid = document.querySelector(".grid");

        items.forEach(item => {
            const div = document.createElement("div");
            div.className = 'bg';

            div.style.gridColumn = item.col;
            div.style.gridRow = item.row;

            grid.appendChild(div);
        });
    </script>

    <script>
        const imagenes = [
            'img/blonegmor.jpg',
            'img/cabbage.jpg',
            'img/cherry_cordial_candy.jpg',
            'img/conejo.jpg',
            'img/shoutao.jpg',
            'img/silica_gel.jpg',
            ''
        ];

        const fondo = div => {
            div.style.backgroundImage = `url(${imagenes[Math.floor(Math.random() * imagenes.length)]})`;
            div.style.borderRadius = `${Math.floor(Math.random() * 26)}px`;
        };

        document.querySelectorAll('.bg').forEach(div => {
            div.addEventListener('mouseenter', () => fondo(div));
        });

        document.addEventListener('mousemove', (e) => {
            const contenedor = document.querySelector('.cursor');
            const punto = document.createElement('div');

            punto.classList.add('rastro');

            punto.style.left = `${e.clientX}px`;
            punto.style.top = `${e.clientY}px`;

            contenedor.appendChild(punto);

            setTimeout(() => {
                punto.remove();
            }, 600);
        });
    </script>
</body>

</html>
