    <title>Nicolle Bustos</title>
    <style>
        :root {
            --medida-celda: calc((100vh) / 16);
        }
        @font-face {
            font-family: 'Tex Gyre Heros';
            src: url('fuentes/texgyreheros-regular.woff2') format('woff2');
            font-weight: normal;
            font-style: normal;
        }
        body {
            cursor: grab;
            overflow: hidden;
            user-select: none;
            height: 100vh;
            margin: 0;
            background: hsl(270, 50%, 95%);
            font-family: 'Tex Gyre Heros', sans-serif;
            font-size: 14px;
            color: #593635;
            letter-spacing: .5px;
            line-height: 1.5;
        }
        .info div {
            display: flex;
            flex-direction: column;
            position: absolute;
            top: 50%;
            left: 50%;
            text-align: center;
            transform: translate(-50%, -50%);
        }
        a {
            color: hsl(270, 50%, 65%);
        }
        .imagenes > div {
            display: grid;
            grid-template-columns: repeat(22, 1fr);
            width: fit-content;
            height: 100%;
        }
        .imagenes > div span {
            width: var(--medida-celda);
            height: var(--medida-celda);
            
        }
        .imagenes > div .span_bg {
            background: white;
        }
        .imagenes {
            display: grid;
            grid-template-rows: repeat(16, 1fr);
            height: 100vh;
            justify-content: center;
        }
    </style>
</head>

        <script>
            const imagenes = [
                'img/albaricoques.jpg',
                'img/cabbage.jpg',
                'img/cherry_cordial_candy.jpg',
                'img/mango_pudding.jpg',
                'img/mantecadas.jpg',
                'img/shoutao.jpg',
                'img/silica_gel.jpg'
            ];

            document.querySelectorAll('.span_bg').forEach(span => {
                span.addEventListener('mouseenter', () => {
                    const randomImage = imagenes[Math.floor(Math.random() * imagenes.length)];
                    span.style.backgroundImage = `url(${randomImage})`;
                    span.style.backgroundSize = 'cover';
                    span.style.backgroundPosition = 'center';
                    span.style.backgroundRepeat = 'no-repeat';
                });
            });
            </script>
