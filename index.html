    <link rel="icon" type="image/png" href="favicon.png">
    <title>Nicolle Bustos</title>
    <style>
        :root {
            --cell-size: calc((100vh) / 16);
        }
        body {
            overflow: hidden;
            user-select: none;
            height: 100vh;
            margin: 0;
            background: hsl(270, 50%, 95%);
            font-family: sans-serif;
            font-size: 14px;
            color: #593635;
            line-height: 1.5;
        }
        .info {
            display: flex;
            flex-direction: column;
            position: absolute;
            width: 100vw;
            height: 100vh;
            justify-content: center;
            align-items: center;
        }
        a {
            color: hsl(270, 50%, 65%);
        }
        .images > div {
            display: grid;
            grid-template-columns: repeat(22, var(--cell-size));
            width: fit-content;
            height: 100%;
        }
        .images > div span {
            width: var(--cell-size);
            height: var(--cell-size);
            transition: .25s ease-out;
        }
        .images > div span:hover {
            background-color: #ffffff;
        }
        .images > div .span_bg {
            background: white;
            animation: latido 4s ease-out infinite;
            -webkit-animation: latido 4s ease-out infinite;
        }
        .images {
            display: grid;
            grid-template-rows: repeat(16, 1fr);
            height: 100vh;
            justify-content: center;
        }
    </style>
</head>
