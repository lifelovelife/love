<!DOCTYPE html>

<head>

    <script src="https://www.youtube.com/iframe_api"></script>
    
    <style>
        * {
            -webkit-user-drag: none;
            -webkit-user-select: none;
            user-select: none;
        }

        iframe {
            box-shadow: 1px 6px 15px 0px #884dffde;
            -webkit-box-shadow: 1px 6px 15px 0px #884dffde;
            -moz-box-shadow: 1px 6px 15px 0px #884dffde;
        }

        .instagram-media {
            width: 100%;
            margin: 0 !important;
        }

        img:not(.ayuda) {
            pointer-events: none;
        }

        .ayuda {
            transform: rotate(10deg);
            transition: .5s ease-out;
            border-radius: 50%;
            box-shadow: 1px 8px 15px 0px #0e21ee9e;
            -webkit-box-shadow: 1px 8px 15px 0px #0e21ee9e;
            -moz-box-shadow: 1px 8px 15px 0px #0e21ee9e;
        }

        .ayuda:hover {
            transform: rotate(240deg);
        }

        .pee {
            display: grid;
            place-items: center;
            grid-template-columns: repeat(4, 1fr);
        }

        .cursor {
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 999999;
        }

        .huella {
            position: absolute;
            width: 120px;
            height: 120px;
            background-image: url("HUELLAS.png");
            background-size: contain;
            background-position: center;
            background-repeat: no-repeat;
            pointer-events: none;
            animation: vanish .7s ease-out forwards;
            z-index: 999999;
        }

        @keyframes vanish {
            from {
                opacity: .3;
                transform: translate(-50%, -50%) scale(1);
            }
            to {
                opacity: 0;
                transform: translate(-50%, -50%) scale(0.5);
            }
        }
    </style>
</head>

<body style="cursor: none !important; background: #defe3f98; margin: 0; overflow-x: hidden;">

    <script>
        document.addEventListener('mousemove', (e) => {
            const contenedor = document.querySelector('.cursor');
            if (!contenedor) return;
            
            const punto = document.createElement('div');
            punto.classList.add('huella');
            punto.style.left = `${e.clientX}px`;
            punto.style.top = `${e.clientY}px`;

            contenedor.appendChild(punto);

            setTimeout(() => {
                punto.remove();
            }, 600);
        });
    </script>
