<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A paradise for seafood lovers</title>
    <link rel="icon" type="image/png" href="resources/orchid.png">
    <style>
        body {
            overflow: hidden;
            height: 100vh;
            background-image: radial-gradient(hsl(214, 26%, 98%) 40%, hsl(222, 50%, 90%) 100%);
            margin: 0;
            color: #593635;
            user-select: none;
            font-family: sans-serif;
            font-size: 14px;
            line-height: 1.5;
        }
        a {color: orchid;}
        #clock {
            opacity: .5;
        }
        div {
            place-items: center;
            display: grid;
            grid-template-columns: repeat(22, 6.25vh);
        }
        div span {
            height: 6.25vh;
            line-height: 1.2;
            aspect-ratio: 1;
            transition: .25s ease-out;
        }
        div span:hover {
            background-color: #ffffffbf;
        }
        .images .span_bg {
            background-size: 100% 100%;
            animation: blink-animation-2 4s ease-out infinite;
            -webkit-animation: blink-animation-2 4s ease-out infinite;
        }
        .images .blink {
            background-color: white;
            animation: blink-animation 4s ease-out infinite;
            -webkit-animation: blink-animation 4s ease-out infinite;
        }
        .images .left {
            background-position: left;
        }
        .images .right {
            background-position: right;
        }
        @keyframes blink-animation {
            0%, 100% {
                opacity: 0;
            }
            50% {
                opacity: .75;
            }
        }
        @-webkit-keyframes blink-animation {
            0%, 100% {
                opacity: 0;
            }
            50% {
                opacity: .75;
            }
        }
        @keyframes blink-animation-2 {
            0%, 100% {
                transform: none;
            }
            50% {
                transform: scale(1.1);
            }
        }
        @-webkit-keyframes blink-animation-2 {
            0%, 100% {
                transform: none;
            }
            50% {
                transform: scale(1.1);
            }
        }
        .images {
            margin: 0 auto;
            display: table;
        }
        /*
        div:hover::before {
            content: '';
            width: 48px;
            height: 48px;
        }
        */
        .text {
            margin: 24px;
            position: absolute;
            bottom: 0;
        }
        .text p {
            display: grid;
        }
    </style>
</head>

        function updateBogotaTime() {
            const now = new Date();
            
            const bogota = now.toLocaleTimeString("en-US", {
            timeZone: "America/Bogota",
            day: '2-digit',
            month: 'short',
            hour: '2-digit',
            minute: '2-digit',
            hour12: true
            });

            document.getElementById('clock').textContent = bogota;
        }

        setInterval(updateBogotaTime, 1000);
        updateBogotaTime();
